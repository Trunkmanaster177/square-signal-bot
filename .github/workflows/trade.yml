name: Futures Trade Bot

on:
  workflow_run:
    workflows: ["Binance Square Signal Bot"]   # runs right after the signal bot finishes
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bot-state
  cancel-in-progress: false

jobs:
  trade:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests
      - name: Run trade bot
        env:
          BINANCE_API_KEY: ${{ secrets.BINANCE_API_KEY }}
          BINANCE_API_SECRET: ${{ secrets.BINANCE_API_SECRET }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DRY_RUN: "true"          # change to "false" only after testing
          TESTNET: "false"
          RUN_ONCE: "true"
          LEVERAGE: "30"
          MARGIN_USDT: "0.5"
          MIN_PROFIT_PCT: "2"
        run: python trade_bot.py
      - name: Save state
        run: |
          git config user.name "trade-bot"
          git config user.email "bot@users.noreply.github.com"
          git pull --rebase || true
          git add trade_state.json || true
          git diff --cached --quiet || (git commit -m "update trade state" && git push)
