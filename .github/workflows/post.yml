name: Binance Square Signal Bot

on:
  schedule:
    # every 1.15 hours (69 minutes), 21 posts a day (UTC)
    - cron: "0 0 * * *"
    - cron: "9 1 * * *"
    - cron: "18 2 * * *"
    - cron: "27 3 * * *"
    - cron: "36 4 * * *"
    - cron: "45 5 * * *"
    - cron: "54 6 * * *"
    - cron: "3 8 * * *"
    - cron: "12 9 * * *"
    - cron: "21 10 * * *"
    - cron: "30 11 * * *"
    - cron: "39 12 * * *"
    - cron: "48 13 * * *"
    - cron: "57 14 * * *"
    - cron: "6 16 * * *"
    - cron: "15 17 * * *"
    - cron: "24 18 * * *"
    - cron: "33 19 * * *"
    - cron: "42 20 * * *"
    - cron: "51 21 * * *"
    - cron: "0 23 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bot-state
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Run bot
        env:
          SQUARE_API_KEY: ${{ secrets.SQUARE_API_KEY }}
          DRY_RUN: "false"
          RUN_ONCE: "true"
        run: python square_signal_bot.py
      - name: Save state
        run: |
          git config user.name "signal-bot"
          git config user.email "bot@users.noreply.github.com"
          git pull --rebase || true
          git add recent.json || true
          git diff --cached --quiet || (git commit -m "update state" && git push)
