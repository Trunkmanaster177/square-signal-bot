name: Binance Square Signal Bot

on:
  schedule:
    - cron: "0 */2 * * *"     # every 2 hours (UTC)
  workflow_dispatch:           # manual "Run workflow" button

permissions:
  contents: write              # needed to save recent.json

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Run bot
        env:
          SQUARE_API_KEY: ${{ secrets.SQUARE_API_KEY }}
          DRY_RUN: "false"
          RUN_ONCE: "true"
        run: python square_signal_bot.py
      - name: Save state
        run: |
          git config user.name "signal-bot"
          git config user.email "bot@users.noreply.github.com"
          git add recent.json || true
          git diff --cached --quiet || (git commit -m "update state" && git push)
